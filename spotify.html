<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="spotify.css">
    <script src="https://kit.fontawesome.com/e2ca1ca32e.js" crossorigin="anonymous"></script>
    <title>Spotify</title>
</head>
<body>
    <header>
        <div class="section">
            <div class="logo">
                <a href="spotify.html"><img src="스포티파이.png" alt="spotify logo"></a>
            </div>
            <div class="search_box">
                <div class="menu">
                    <div class="home"><i class="fa-regular fa-house"></i></div>
                    <input type="text" placeholder="Search" class="search">
                </div>
            </div>
            <div class="setting">
                <div class="premium-button">Premium둘러보기</div>
                <span class="app-download">앱 다운로드</span>
                <span class="alam">알림</span>
                <img class="profile" src="프로필.jpg">
            </div> 
        </div>
    </header>
    <nav class="charts">
        <div class="my-library">
            <img class="normal" src="버튼.png">
            <img class="hover" src="열기버튼.png">
        </div>
        <div class="making"></div>
        <div class="playlists">
            <div id="jpop"><img src="음악01.jpg"></div>
            <div id="kpop"><img src="음악02.jpg"></div>
            <div id="pop"><img src="음악03.jpg"></div>
            <div id="hiphop"><img src="음악04.jpg"></div>
        </div>
    </nav>
    <main>
        <div class="category">
            <button id="all">모두</button>
            <button id="music">음악</button>
            <button id="podcast">팟캐스트</button>
            <button id="audiobook">오디오북</button>
        </div>
        <div class="box">
            <div id="j-box"></div>
            <div id="k-box"></div>
            <div id="p-box"></div>
            <div id="h-box"></div>
        </div>
        <div class="suggest">
            <div class="start">
                <span class="start-title">시작하기</span>
                <div class="start-box"></div>
            </div>
        </div>
        <div class="mix">
            <span class="mix-title">박성준님을 위한 믹스&추천</span>
            <div class="mix-box">
                <div id="mix1">
                    <!--img-->
                    <span class="mix-explain">Mix 1</span>
                </div>
                <div id="mix2">
                    <!--img-->
                    <span class="mix-explain">Mix 2</span>
                </div>
                <div id="mix3">
                    <!--img-->
                    <span class="mix-explain">Mix 3</span>
                </div>
                <div id="mix4">
                    <!--img-->
                    <span class="mix-explain">Mix 4</span>
                </div>
            </div>
        </div>
        <div class="station">
            <div class="singer" id="singer1">
                <!--img-->
                <span class="singer-name">~</span>
            </div>
            <div class="singer" id="singer2">
                <!--img-->
                <span class="singer-name">~</span>
            </div>
            <div class="singer" id="singer3">
                <!--img-->
                <span class="singer-name">~</span>
            </div>
            <div class="singer" id="singer4">
                <!--img-->
                <span class="singer-name">~</span>
            </div>
            <div class="singer" id="singer5">
                <!--img-->
                <span class="singer-name">~</span>
            </div>
            <div class="singer" id="singer6">
                <!--img-->
                <span class="singer-name">~</span>
            </div>
            <div class="singer" id="singer7">
                <!--img-->
                <span class="singer-name">~</span>
            </div>
        </div>
    </main>
</body>
</html>
