<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>네이버웹툰</title>
    <link rel="stylesheet" href="navercomic.css">
    <script src="navercomic.js" defer></script>
</head>
<body>
    <header class="section">
        <div class="head">
            <div class="prong" data-tabs data-initial="0" role="tablist">
                <h3 class="tab tab-main" role="tab">네이버웹툰</h3>
                <span>|</span>
                <h3 class="tab tab-main" role="tab">웹소설</h3>
                <span>|</span>
                <h3 class="tab tab-main" role="tab">시리즈</h3>
            </div>
        </div>
    </header>
    <hr>
    <nav class="section">
        <div class="sub-prong" data-tabs data-initial="0" role="tablist">
            <div class="tab tab-sub" role="tab">홈</div>
            <div class="tab tab-sub" role="tab">웹툰</div>
            <div class="tab tab-sub" role="tab">컷츠</div>
            <div class="tab tab-sub tab-sub--wide" role="tab">베스트도전</div>
            <div class="tab tab-sub tab-sub--wide" role="tab">도전만화</div>
            <div class="tab tab-sub tab-sub--wide" role="tab">마이페이지</div>
        </div>
    </nav>
    <hr>
    <main class="section">
        <div class="todaycomic" data-tabs role="tablist">
            <span class="todaycomic-title">웹툰</span>
            <span class="tab tab-sort" role="tab">인기순</span>
            <span class="tab tab-sort" role="tab">업데이트순</span>
            <span class="tab tab-sort" role="tab">조회순</span>
            <span class="tab tab-sort" role="tab">별점순</span>
        </div>

        <ul class="comic-list">
            <li>
                <img class="cover" src="잔불의 기사.jpg" alt="잔불의 기사" width="230" height="300">
                <div class="comic-info">
                    <span class="title">잔불의 기사</span>
                    <span class="author">글-그림:환댕</span>
                </div>
            </li>
            <li>
                <img class="cover" src="별이삼샵.webp" alt="별이삼샵" width="230" height="300">
                <div class="comic-info">
                    <span class="title">별이삼샵</span>
                    <span class="author">글-그림:혀노</span>
                </div>
            </li>
            <li>
                <img class="cover" src="연애혁명.webp" alt="연애혁명" width="230" height="300">
                <div class="comic-info">
                    <span class="title">연애혁명</span>
                    <span class="author">글-그림:232</span>
                </div>
            </li>
            <li>
                <img class="cover" src="미드우트.jpg" alt="미드우트" width="230" height="300">
                <div class="comic-info">
                    <span class="title">미드우트</span>
                    <span class="author">글-그림:원김</span>
                </div>
            </li>
            <li>
                <img class="cover" src="시든 꽃에 눈물을.webp" alt="시든 꽃에 눈물을" width="230" height="300">
                <div class="comic-info">
                    <span class="title">시든 꽃에 눈물을</span>
                    <span class="author">글-그림:개</span>
                </div>
            </li>
        </ul>

        <aside class="advert">
            <img src="광고.png" alt="광고" loading="lazy">
        </aside>

        <section class="genre">
            <h2 class="genre-title">장르</h2>
            <ul class="genre-list" data-tabs role="tablist">
                <li><span class="tab tab-genre" role="tab">로맨스</span></li>
                <li><span class="tab tab-genre" role="tab">판타지</span></li>
                <li><span class="tab tab-genre" role="tab">액션</span></li>
                <li><span class="tab tab-genre" role="tab">일상</span></li>
                <li><span class="tab tab-genre" role="tab">스릴러</span></li>
                <li><span class="tab tab-genre" role="tab">개그</span></li>
                <li><span class="tab tab-genre" role="tab">무협</span></li>
                <li><span class="tab tab-genre" role="tab">드라마</span></li>
                <li><span class="tab tab-genre" role="tab">감성</span></li>
                <li><span class="tab tab-genre" role="tab">스포츠</span></li>
            </ul>
        </section>
    </main>
</body>
</html>
