<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <!-- 하단 플레이어 -->
    <div class="music-player" id="musicPlayer">
        <img src="music.jpg" alt="앨범 이미지">

        <div class="music-info">
            <p>현재 재생 중인 노래</p>
            <span>아티스트 이름</span>
        </div>

        <button id="openMusicInfo">상세 정보</button>
    </div>

    <!-- 오른쪽 상세 창 -->
    <aside class="music-detail" id="musicDetail">

        <header class="detail-header">
            <h3>현재 재생 중</h3>
            <button id="closeMusicInfo">✕</button>
        </header>

        <img src="music.jpg" alt="앨범 이미지">

        <div class="detail-info">
            <h2>노래 제목</h2>
            <p>아티스트 이름</p>
        </div>

        <section class="lyrics">
            <h3>가사 미리 보기</h3>
            <p>노래 가사가 표시되는 공간</p>
        </section>

        <section class="artist-info">
            <h3>아티스트 상세정보</h3>
        </section>

    </aside>    
</body>
</html>
